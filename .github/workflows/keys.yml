name: Keys

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays 06:00 UTC: re-extract from the latest Happ release and run the crypt5 canary.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.13"
  HAPP_SUB_REPO: loss-and-quick/happ-sub
  FAILURE_ISSUE_TITLE: "Happ key extraction failed on the latest release"
  CANARY_ISSUE_TITLE: "crypt5 canary failed: URL keys rotated?"
  UA_ISSUE_TITLE: "Happ UA builder not found"

jobs:
  lint-test:
    name: Lint and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      HAPP_APK_CACHE: ${{ github.workspace }}/.apk-cache
      HAPP_REQUIRE_APKS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements.txt

      - name: Ruff
        run: |
          ruff check --output-format=github .
          ruff format --check .

      - name: Restore pinned APKs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .apk-cache
          key: happ-apks-${{ hashFiles('tests/apks.json') }}

      - name: Fetch pinned APKs
        run: python -m happ_keys fetch-apks --dest "$HAPP_APK_CACHE"

      - name: Pytest
        run: python -m pytest -v -rs

  extract:
    name: Extract from latest release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    outputs:
      tag: ${{ steps.apk.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements.txt

      - name: Download latest Happ release
        id: apk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/apk" out
          gh api repos/Happ-proxy/happ-android/releases/latest > "$RUNNER_TEMP/release.json"
          tag=$(jq -r .tag_name "$RUNNER_TEMP/release.json")
          # Prefer the stable asset name; some releases only ship Happ_beta.apk.
          asset=$(jq -c '[.assets[] | select(.name | endswith(".apk"))] | (map(select(.name == "Happ.apk")) + .)[0] // empty' \
            "$RUNNER_TEMP/release.json")
          if [ -z "$asset" ]; then
            echo "::error::Release $tag has no APK asset"
            exit 1
          fi
          url=$(jq -r .browser_download_url <<<"$asset")
          digest=$(jq -r '.digest // empty' <<<"$asset")
          curl -fsSL --max-time 900 --retry 3 --retry-delay 15 --retry-all-errors \
            -o "$RUNNER_TEMP/apk/Happ.apk" "$url"
          sha=$(sha256sum "$RUNNER_TEMP/apk/Happ.apk" | cut -d' ' -f1)
          if [ -n "$digest" ] && [ "sha256:$sha" != "$digest" ]; then
            echo "::error::Downloaded APK sha256 $sha does not match the release digest $digest"
            exit 1
          fi
          echo "Happ $tag: $url sha256=$sha"
          {
            echo "tag=$tag"
            echo "sha256=$sha"
          } >> "$GITHUB_OUTPUT"

      - name: Extract and verify keys
        id: extract
        run: |
          status=0
          python -m happ_keys extract "$RUNNER_TEMP/apk/Happ.apk" \
            -o out/keys.json --meta out/meta.json --signers out/signers.json --report json > out/report.json || status=$?
          cat out/report.json
          exit "$status"

      - name: Upload extraction result
        if: always() && steps.extract.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extraction
          path: out/
          retention-days: 30

      - name: Open or update the failure issue
        if: failure() && steps.extract.outcome == 'failure' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.apk.outputs.tag }}
          APK_SHA: ${{ steps.apk.outputs.sha256 }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing=$(gh issue list --state open --limit 100 --json number,title \
            | jq -r --arg t "$FAILURE_ISSUE_TITLE" 'map(select(.title == $t)) | .[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Extraction failed again on Happ $TAG (\`$APK_SHA\`): $RUN_URL"
            exit 0
          fi
          gh issue create --title "$FAILURE_ISSUE_TITLE" --body-file - <<EOF
          The extractor failed on the latest Happ release.

          - Release: $TAG
          - APK SHA-256: \`$APK_SHA\`
          - Run: $RUN_URL

          Likely causes: the JNI epilogue or exported symbol in \`liberror-code.so\` changed, the DEX shape the parser keys on changed, the stego icon encoding changed, or a verification check failed. The run log and the \`extraction\` artifact have the report.
          EOF

      - name: Close the failure issue
        if: success() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.apk.outputs.tag }}
        run: |
          existing=$(gh issue list --state open --limit 100 --json number,title \
            | jq -r --arg t "$FAILURE_ISSUE_TITLE" 'map(select(.title == $t)) | .[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue close "$existing" --comment "Extraction passes all checks on Happ $TAG."
          fi

      # A missing User-Agent builder only warns: keys and signers still sync, release.rs does not.
      - name: Track the User-Agent builder issue
        if: success() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.apk.outputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing=$(gh issue list --state open --limit 100 --json number,title \
            | jq -r --arg t "$UA_ISSUE_TITLE" 'map(select(.title == $t)) | .[0].number // empty')
          if [ "$(jq -r .checks.user_agent_builder.passed out/report.json)" = "true" ]; then
            if [ -n "$existing" ]; then
              gh issue close "$existing" --comment "The User-Agent builder is found again in Happ $TAG."
            fi
            exit 0
          fi
          error=$(jq -r '.checks.user_agent_builder.error // "unknown error"' out/report.json)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still not found in Happ $TAG ($error): $RUN_URL"
            exit 0
          fi
          gh issue create --title "$UA_ISSUE_TITLE" --body-file - <<EOF
          The extractor could not read the User-Agent build stamp and suffix from Happ $TAG.

          - Error: $error
          - Run: $RUN_URL

          Key and signer sync still run, but happ-sub-sync leaves \`src/release.rs\` unchanged, so happ-sub keeps sending the previous release's User-Agent. Find the method holding the \`"Happ/<version>/"\` literal and update \`happ_keys/user_agent.py\`.
          EOF

  happ-sub-sync:
    name: Sync tables and signers with happ-sub
    needs: extract
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: happ-sub-sync
      cancel-in-progress: false
    steps:
      - name: Require HAPP_SUB_PR_TOKEN
        env:
          HAPP_SUB_PR_TOKEN: ${{ secrets.HAPP_SUB_PR_TOKEN }}
        run: |
          if [ -z "$HAPP_SUB_PR_TOKEN" ]; then
            echo "::error title=Missing secret::HAPP_SUB_PR_TOKEN is not set. Add a fine-grained PAT scoped to $HAPP_SUB_REPO with Contents and Pull requests read/write."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.HAPP_SUB_REPO }}
          token: ${{ secrets.HAPP_SUB_PR_TOKEN }}
          path: happ-sub

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extraction
          path: out

      # The generator only needs the standard library, so no dependency install here.
      - name: Fetch latest Happ Desktop and Incy releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m happ_keys upstream-releases > out/upstream-releases.json
          desktop_deb=$(jq -r '.happ_desktop.deb_asset.url // empty' out/upstream-releases.json)
          if [ -n "$desktop_deb" ]; then
            python -m happ_keys release-sync --repo happ-sub --from-upstream-happ-desktop --download-to out/Happ.linux.x64.deb > /dev/null
          fi

      - name: Compare with happ-sub
        id: sync
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          desktop_args=()
          if [ -f out/Happ.linux.x64.deb ]; then
            desktop_args+=(--desktop-deb out/Happ.linux.x64.deb)
          fi
          incy_version=$(jq -r '.incy.android.version // empty' out/upstream-releases.json)
          incy_version_code=$(jq -r '.incy.android.version_code // empty' out/upstream-releases.json)
          incy_desktop_version=$(jq -r '.incy.desktop.version // empty' out/upstream-releases.json)
          if [ -n "$incy_version" ] && [ -n "$incy_version_code" ]; then
            desktop_args+=(--incy-version "$incy_version" --incy-version-code "$incy_version_code")
          fi
          if [ -n "$incy_desktop_version" ]; then
            desktop_args+=(--incy-desktop-version "$incy_desktop_version")
          fi
          python -m happ_keys happ-sub-sync \
            --keys out/keys.json --meta out/meta.json --report out/report.json --signers out/signers.json \
            --repo happ-sub --write --pr-body out/pr-body.md --run-url "$RUN_URL" "${desktop_args[@]}" > out/sync.json
          cat out/sync.json
          {
            echo "drift=$(jq -r .drift out/sync.json)"
            echo "branch=$(jq -r '.branch // empty' out/sync.json)"
            echo "title=$(jq -r '.title // empty' out/sync.json)"
            echo "sync_sha256=$(jq -r .sync_sha256 out/sync.json)"
            echo "version=$(jq -r .version out/sync.json)"
          } >> "$GITHUB_OUTPUT"
          if [ "$(jq -r .drift out/sync.json)" = "false" ]; then
            echo "No drift: extracted table equals $(jq -r .matched out/sync.json) and the signers and release constants match $HAPP_SUB_REPO."
          fi

      - name: Open or update the happ-sub pull request
        if: steps.sync.outputs.drift == 'true'
        working-directory: happ-sub
        env:
          GH_TOKEN: ${{ secrets.HAPP_SUB_PR_TOKEN }}
          BRANCH: ${{ steps.sync.outputs.branch }}
          TITLE: ${{ steps.sync.outputs.title }}
          SYNC_SHA: ${{ steps.sync.outputs.sync_sha256 }}
          VERSION: ${{ steps.sync.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # An open PR that already carries this change (same branch, or same digest over the table and
          # the signers) is reused, so weekly runs and later releases comment instead of duplicating it.
          existing=$(gh pr list --repo "$HAPP_SUB_REPO" --state open --limit 100 --json number,headRefName,body \
            | jq -r --arg b "$BRANCH" --arg m "happ-sub-sync-sha256: $SYNC_SHA" \
              'map(select(.headRefName == $b or (.body | contains($m)))) | .[0].number // empty')
          if [ -n "$existing" ]; then
            gh pr comment "$existing" --repo "$HAPP_SUB_REPO" \
              --body "Same change still observed in Happ $VERSION (digest \`$SYNC_SHA\`): $RUN_URL"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add src/keys src/device src/release.rs
          git commit -m "$TITLE" -m "Extracted from Happ $VERSION by $RUN_URL"
          git push --force origin "$BRANCH"
          gh pr create --repo "$HAPP_SUB_REPO" --base main --head "$BRANCH" \
            --title "$TITLE" --body-file ../out/pr-body.md

  crypt5-canary:
    name: crypt5 canary
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements.txt

      # Exits 0 with a warning when the generator is unreachable; fails only on a decrypt mismatch.
      - name: Run canary
        id: canary
        run: python -m happ_keys.canary tests/data/crypt5_keys.json | tee "$RUNNER_TEMP/canary.log"

      - name: Open or update the canary issue
        if: failure() && steps.canary.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing=$(gh issue list --state open --limit 100 --json number,title \
            | jq -r --arg t "$CANARY_ISSUE_TITLE" 'map(select(.title == $t)) | .[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Canary failed again: $RUN_URL"
            exit 0
          fi
          gh issue create --title "$CANARY_ISSUE_TITLE" --body-file - <<EOF
          The weekly canary could not decrypt a fresh \`happ://crypt5/\` link from crypto.happ.su with the pinned keys in \`tests/data/crypt5_keys.json\`.

          - Run: $RUN_URL

          Either the generator uses a marker missing from the pinned keyring (RSA keys rotated or added), or the wire format changed. The run log shows the observed marker.
          EOF

      - name: Close the canary issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # A skipped run (generator unreachable) proves nothing, so only a verified decrypt closes it.
          grep -q '^SUCCESS:' "$RUNNER_TEMP/canary.log" || exit 0
          existing=$(gh issue list --state open --limit 100 --json number,title \
            | jq -r --arg t "$CANARY_ISSUE_TITLE" 'map(select(.title == $t)) | .[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue close "$existing" --comment "Canary decrypted a fresh link again."
          fi
