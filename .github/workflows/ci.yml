name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.13"

jobs:
  lint-test:
    name: Lint and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      HAPP_APK_CACHE: ${{ github.workspace }}/.apk-cache
      HAPP_REQUIRE_APKS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements.txt

      - name: Ruff
        run: |
          ruff check --output-format=github .
          ruff format --check .

      - name: Restore pinned APKs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .apk-cache
          key: happ-apks-${{ hashFiles('tests/apks.json') }}

      - name: Fetch pinned APKs
        run: python -m happ_keys fetch-apks --dest "$HAPP_APK_CACHE"

      - name: Pytest
        run: python -m pytest -v -rs
